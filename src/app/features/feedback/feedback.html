<div class="feedback-page">
  <div class="feedback-card">
    <button mat-button class="back-btn" (click)="goHome()">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </button>

    <h1 class="feedback-title">Enviar feedback</h1>
    <p class="feedback-sub">
      Encontrou um problema ou tem uma sugestão? Sua mensagem vai direto para o nosso e-mail.
    </p>

    <ng-container *ngIf="!sent; else sentTpl">
      <form [formGroup]="form" class="feedback-form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="feedback-field">
          <mat-label>Tipo</mat-label>
          <mat-select formControlName="type">
            <mat-option *ngFor="let option of typeOptions" [value]="option.value">
              {{ option.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="feedback-field">
          <mat-label>Seu nome</mat-label>
          <input matInput formControlName="name" placeholder="Opcional" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="feedback-field">
          <mat-label>Seu e-mail</mat-label>
          <input matInput type="email" formControlName="email" placeholder="Para podermos responder" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="feedback-field">
          <mat-label>Mensagem</mat-label>
          <textarea
            matInput
            formControlName="message"
            rows="5"
            placeholder="Conte o que aconteceu ou o que você gostaria de ver no CatWorld"
          ></textarea>
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="feedback-submit"
          [disabled]="form.invalid"
        >
          <mat-icon>send</mat-icon>
          Enviar feedback
        </button>
      </form>
    </ng-container>

    <ng-template #sentTpl>
      <div class="feedback-sent">
        <mat-icon class="feedback-sent-icon">mark_email_read</mat-icon>
        <p>
          Seu app de e-mail deve abrir com a mensagem pronta — é só clicar em enviar por lá
          para concluir.
        </p>
        <button mat-stroked-button color="primary" (click)="sendAnother()">
          Enviar outro feedback
        </button>
      </div>
    </ng-template>
  </div>
</div>
