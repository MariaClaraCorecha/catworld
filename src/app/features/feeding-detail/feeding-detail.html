<div class="detail-page" *ngIf="feeding() as f">

  <div class="detail-hero">
    <img [src]="f.image" [alt]="f.title" class="detail-hero-img" />
    <div class="detail-hero-overlay">
      <div class="detail-hero-content">

        <button mat-button class="back-btn" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Voltar para alimentação
        </button>

        <mat-chip-set class="detail-chips">
          <mat-chip color="primary" highlighted>
            <mat-icon matChipAvatar>{{ f.icon }}</mat-icon>
            {{ f.category }}
          </mat-chip>
        </mat-chip-set>

        <h1 class="detail-title">{{ f.title }}</h1>

      </div>
    </div>
  </div>

  <div class="detail-body">
    <div class="detail-container">

      <p class="detail-summary">{{ f.summary }}</p>

      <mat-divider />

      <div class="detail-content">
        <p *ngFor="let paragraph of f.content.trim().split('\n\n')">
          {{ paragraph.trim() }}
        </p>
      </div>

      <mat-divider />

      <div class="tips">
        <h3 class="tips-title">
          <mat-icon>tips_and_updates</mat-icon>
          Dicas rápidas
        </h3>
        <div class="tips-list">
          <div class="tip-item" *ngFor="let tip of f.tips">
            <mat-icon>check_circle</mat-icon>
            <span>{{ tip }}</span>
          </div>
        </div>
      </div>

      <mat-divider />

      <div class="detail-footer-nav">
        <button mat-stroked-button color="primary" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Ver todos os tópicos
        </button>
      </div>

    </div>
  </div>

</div>
