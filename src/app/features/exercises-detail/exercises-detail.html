<div class="detail-page" *ngIf="exercise() as e">

  <div class="detail-hero">
    <img *ngIf="e.image" [src]="e.image" [alt]="e.title" class="detail-hero-img" />
    <div *ngIf="!e.image" class="detail-hero-icon">
      <mat-icon>{{ e.icon }}</mat-icon>
    </div>
    <div class="detail-hero-overlay">
      <div class="detail-hero-content">

        <button mat-button class="back-btn" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Voltar para exercícios
        </button>

        <mat-chip-set class="detail-chips">
          <mat-chip color="primary" highlighted>
            {{ e.category }}
          </mat-chip>
        </mat-chip-set>

        <h1 class="detail-title">{{ e.title }}</h1>

      </div>
    </div>
  </div>

  <div class="detail-body">
    <div class="detail-container">

      <p class="detail-summary">{{ e.summary }}</p>

      <mat-divider />

      <div class="detail-content">
        <p *ngFor="let paragraph of e.content.trim().split('\n\n')">
          {{ paragraph.trim() }}
        </p>
      </div>

      <mat-divider />

      <div class="tips">
        <h3 class="tips-title">
          <mat-icon>tips_and_updates</mat-icon>
          Dicas rápidas
        </h3>
        <div class="tips-list">
          <div class="tip-item" *ngFor="let tip of e.tips">
            <mat-icon>check_circle</mat-icon>
            <span>{{ tip }}</span>
          </div>
        </div>
      </div>

      <mat-divider />

      <div class="detail-footer-nav">
        <button mat-stroked-button color="primary" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Ver todos os tópicos
        </button>
      </div>

    </div>
  </div>

</div>
