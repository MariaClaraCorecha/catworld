<div class="profile-page" *ngIf="authService.user() as user">
  <div class="profile-card">
    <button mat-button class="back-btn" (click)="goHome()">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </button>

    <img [src]="user.photoUrl" [alt]="user.name" class="profile-avatar" />

    <h1 class="profile-name">{{ user.name }}</h1>
    <p class="profile-email">{{ user.email }}</p>

    <mat-divider class="profile-divider" />

    <form [formGroup]="form" class="profile-form" (ngSubmit)="save()">
      <mat-form-field appearance="outline" class="profile-field">
        <mat-label>Data de nascimento</mat-label>
        <input matInput type="date" formControlName="birthDate" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="profile-field">
        <mat-label>Sobre mim</mat-label>
        <textarea
          matInput
          formControlName="bio"
          rows="3"
          placeholder="Conte um pouco sobre você"
        ></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="profile-field">
        <mat-label>Cidade</mat-label>
        <input matInput formControlName="city" placeholder="Ex: São Paulo" />
      </mat-form-field>

      <h2 class="profile-section-title">Meus gatos</h2>

      <div formArrayName="cats" class="cats-list">
        <div *ngFor="let catGroup of cats.controls; let i = index" [formGroupName]="i" class="cat-card">
          <div class="cat-card-header">
            <span class="cat-card-title">Gato {{ i + 1 }}</span>
            <button
              *ngIf="cats.length > 1"
              mat-icon-button
              type="button"
              class="cat-remove-btn"
              (click)="removeCat(i)"
              aria-label="Remover gato"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>

          <mat-form-field appearance="outline" class="profile-field">
            <mat-label>Nome do gato</mat-label>
            <input matInput formControlName="name" placeholder="Ex: Frajola" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="profile-field">
            <mat-label>Raça</mat-label>
            <mat-select formControlName="breed">
              <mat-option *ngFor="let option of breedOptions" [value]="option">
                {{ option }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="profile-field">
            <mat-label>Gênero</mat-label>
            <mat-select formControlName="gender">
              <mat-option *ngFor="let option of genderOptions" [value]="option">
                {{ option }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="profile-field">
            <mat-label>Cor</mat-label>
            <input matInput formControlName="color" placeholder="Ex: Preto e branco" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="profile-field">
            <mat-label>Idade (anos)</mat-label>
            <input matInput type="number" min="0" formControlName="age" placeholder="Ex: 2" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="profile-field">
            <mat-label>Pelagem</mat-label>
            <mat-select formControlName="fur">
              <mat-option *ngFor="let option of furOptions" [value]="option">
                {{ option }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      <button
        mat-stroked-button
        color="primary"
        type="button"
        class="add-cat-btn"
        (click)="addCat()"
      >
        <mat-icon>add</mat-icon>
        Adicionar outro gato
      </button>

      <button mat-flat-button color="primary" type="submit" class="profile-save">
        <mat-icon>save</mat-icon>
        Salvar alterações
      </button>

      <p *ngIf="saved" class="profile-saved-msg">Perfil atualizado!</p>
    </form>

    <mat-divider class="profile-divider" />

    <button mat-stroked-button color="warn" class="profile-logout" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Sair da conta
    </button>
  </div>
</div>
