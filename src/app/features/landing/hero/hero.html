<section class="hero">
  <div class="hero-content">

    <span class="hero-eyebrow">
      <mat-icon>pets</mat-icon>
      Bem-vindo ao CatWorld
    </span>

    <h1 class="hero-title">{{ headline }}</h1>
    <p class="hero-subtitle">{{ subtitle }}</p>

    <mat-chip-set class="hero-topics">
      <mat-chip *ngFor="let topic of topics" (click)="goToTopic(topic.id)">
        <mat-icon matChipAvatar>{{ topic.icon }}</mat-icon>
        {{ topic.label }}
      </mat-chip>
    </mat-chip-set>

    <button mat-raised-button color="primary" class="hero-cta" (click)="explore()">
      <mat-icon>explore</mat-icon>
      Explorar agora
    </button>

  </div>
</section>
