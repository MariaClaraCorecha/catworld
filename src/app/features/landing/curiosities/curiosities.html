<section id="curiosidades" class="section">
  <div class="container">

    <h2 class="section-title">Curiosidades Felinas</h2>
    <p class="section-sub">
      Fatos surpreendentes sobre o comportamento e a anatomia dos gatos
    </p>

    <div class="curiosities-grid">
      <mat-card
        *ngFor="let curiosity of curiosities"
        class="curiosity-card"
        matRipple
        (click)="goToDetail(curiosity.id)"
      >
        <div class="card-icon-banner">
          <mat-icon>{{ curiosity.icon }}</mat-icon>
        </div>

        <mat-card-header>
          <mat-card-title>{{ curiosity.title }}</mat-card-title>
          <mat-card-subtitle>
            <mat-chip-set>
              <mat-chip color="primary" highlighted>
                {{ curiosity.category }}
              </mat-chip>
            </mat-chip-set>
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p class="curiosity-summary">{{ curiosity.summary }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-button color="primary">
            <mat-icon>menu_book</mat-icon>
            Saiba mais
          </button>
          <mat-icon class="card-arrow">arrow_forward</mat-icon>
        </mat-card-actions>

      </mat-card>
    </div>

  </div>
</section>
