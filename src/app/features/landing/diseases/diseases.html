<section id="doencas" class="section">
  <div class="container">

    <h2 class="section-title">Doenças Comuns e Tratamentos</h2>
    <p class="section-sub">
      Conhecer os sinais das doenças mais comuns ajuda a agir cedo e a dar mais qualidade de vida ao seu gato
    </p>

    <div class="diseases-grid">
      <mat-card
        *ngFor="let disease of diseases"
        class="disease-card"
        matRipple
        (click)="goToDetail(disease.id)"
      >
        <img
          *ngIf="disease.image"
          mat-card-image
          [src]="disease.image"
          [alt]="disease.title"
          loading="lazy"
        />
        <div *ngIf="!disease.image" class="card-icon-banner">
          <mat-icon>{{ disease.icon }}</mat-icon>
        </div>

        <mat-card-header>
          <mat-card-title>{{ disease.title }}</mat-card-title>
          <mat-card-subtitle>
            <mat-chip-set>
              <mat-chip color="primary" highlighted>
                {{ disease.category }}
              </mat-chip>
            </mat-chip-set>
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p class="disease-summary">{{ disease.summary }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-button color="primary">
            <mat-icon>menu_book</mat-icon>
            Saiba mais
          </button>
          <mat-icon class="card-arrow">arrow_forward</mat-icon>
        </mat-card-actions>

      </mat-card>
    </div>

  </div>
</section>
