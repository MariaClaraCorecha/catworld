<section id="cuidados" class="section">
  <div class="container">

    <h2 class="section-title">Cuidados com seu Gato</h2>
    <p class="section-sub">Tudo que você precisa saber para manter seu felino saudável e feliz</p>

    <div class="care-grid">
      <mat-card
        *ngFor="let care of cares"
        class="care-card"
        matRipple
        (click)="goToDetail(care.id)"
      >
        <img mat-card-image
          [src]="care.image"
          [alt]="care.title"
          loading="lazy"
        />

        <mat-card-header>
          <mat-card-title>{{ care.title }}</mat-card-title>
          <mat-card-subtitle>
            <mat-chip-set>
              <mat-chip color="primary" highlighted>
                <mat-icon matChipAvatar>{{ care.icon }}</mat-icon>
                {{ care.category }}
              </mat-chip>
            </mat-chip-set>
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p class="care-summary">{{ care.summary }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-button color="primary">
            <mat-icon>menu_book</mat-icon>
            Saiba mais
          </button>
          <mat-icon class="card-arrow">arrow_forward</mat-icon>
        </mat-card-actions>

      </mat-card>
    </div>

  </div>
</section>
