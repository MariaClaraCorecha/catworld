<section id="exercicios" class="section">
  <div class="container">

    <h2 class="section-title">Exercícios e Enriquecimento</h2>
    <p class="section-sub">
      Movimento e estímulo mental são essenciais para a saúde e a felicidade do seu gato
    </p>

    <div class="exercises-grid">
      <mat-card
        *ngFor="let exercise of exercises"
        class="exercise-card"
        matRipple
        (click)="goToDetail(exercise.id)"
      >
        <img
          *ngIf="exercise.image"
          mat-card-image
          [src]="exercise.image"
          [alt]="exercise.title"
          loading="lazy"
        />
        <div *ngIf="!exercise.image" class="card-icon-banner">
          <mat-icon>{{ exercise.icon }}</mat-icon>
        </div>

        <mat-card-header>
          <mat-card-title>{{ exercise.title }}</mat-card-title>
          <mat-card-subtitle>
            <mat-chip-set>
              <mat-chip color="primary" highlighted>
                {{ exercise.category }}
              </mat-chip>
            </mat-chip-set>
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p class="exercise-summary">{{ exercise.summary }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-button color="primary">
            <mat-icon>menu_book</mat-icon>
            Saiba mais
          </button>
          <mat-icon class="card-arrow">arrow_forward</mat-icon>
        </mat-card-actions>

      </mat-card>
    </div>

  </div>
</section>
