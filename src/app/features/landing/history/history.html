<section id="historia" class="section">
  <div class="container">

    <h2 class="section-title">História dos Gatos na Humanidade</h2>
    <p class="section-sub">Uma jornada de 10.000 anos ao lado do ser humano</p>

    <div class="timeline-bar">
      <span class="timeline-line"></span>
      <span class="timeline-label">4.000 a.C. → hoje</span>
      <span class="timeline-line"></span>
    </div>

    <!-- Grid de mat-card -->
    <div class="history-grid">
      <mat-card
        *ngFor="let card of cards"
        class="history-card"
        matRipple
        (click)="openCard(card)"
      >
        <!-- Imagem no topo -->
        <img mat-card-image [src]="card.image" [alt]="card.title" loading="lazy" />

        <!-- Chips de período e ano -->
        <mat-card-header>
          <mat-card-title>{{ card.title }}</mat-card-title>
          <mat-card-subtitle>
            <mat-chip-set>
              <mat-chip color="primary" highlighted>
                {{ card.period }}
              </mat-chip>
              <mat-chip>{{ card.year }}</mat-chip>
            </mat-chip-set>
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p class="card-text">{{ card.text }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-button color="primary">
            <mat-icon>auto_stories</mat-icon>
            Ler mais
          </button>
        </mat-card-actions>
      </mat-card>
    </div>

  </div>
</section>

<!-- Modal -->
<div class="modal-overlay" *ngIf="selectedCard" (click)="closeCard()">
  <mat-card class="modal-card" (click)="$event.stopPropagation()">

    <button mat-icon-button class="modal-close" (click)="closeCard()">
      <mat-icon>close</mat-icon>
    </button>

    <img mat-card-image [src]="selectedCard.image" [alt]="selectedCard.title" />

    <mat-card-header>
      <mat-card-title>{{ selectedCard.title }}</mat-card-title>
      <mat-card-subtitle>
        <mat-chip-set>
          <mat-chip color="primary" highlighted>{{ selectedCard.period }}</mat-chip>
          <mat-chip>{{ selectedCard.year }}</mat-chip>
        </mat-chip-set>
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>{{ selectedCard.text }}</p>
    </mat-card-content>

  </mat-card>
</div>
