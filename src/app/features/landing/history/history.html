<section id="historia" class="section">
  <div class="container">

    <h2 class="section-title">História dos Gatos na Humanidade</h2>
    <p class="section-sub">Uma jornada de 10.000 anos ao lado do ser humano</p>

    <div class="timeline-bar">
      <span class="timeline-line"></span>
      <mat-icon class="timeline-icon">history_edu</mat-icon>
      <span class="timeline-label">4.000 a.C. → hoje</span>
      <mat-icon class="timeline-icon">history_edu</mat-icon>
      <span class="timeline-line"></span>
    </div>

    <div class="history-grid">
      <mat-card
        *ngFor="let card of cards"
        class="history-card"
        matRipple
        (click)="goToDetail(card.id)"
      >
        <img mat-card-image [src]="card.image" [alt]="card.title" loading="lazy" />

        <mat-card-header>
          <mat-card-title>{{ card.title }}</mat-card-title>
          <mat-card-subtitle>
            <mat-chip-set>
              <mat-chip color="primary" highlighted>
                <mat-icon matChipAvatar>schedule</mat-icon>
                {{ card.period }}
              </mat-chip>
              <mat-chip>{{ card.year }}</mat-chip>
            </mat-chip-set>
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p class="card-text">{{ card.summary }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-button color="primary">
            <mat-icon>auto_stories</mat-icon>
            Ler artigo completo
          </button>
          <mat-icon class="card-arrow">arrow_forward</mat-icon>
        </mat-card-actions>

      </mat-card>
    </div>

  </div>
</section>
