<section id="racas" class="section">
  <div class="container">

    <h2 class="section-title">Raças de Gatos</h2>
    <p class="section-sub">Conheça as personalidades únicas de cada raça</p>

    <div class="breeds-grid">
      <mat-card
        *ngFor="let breed of breeds"
        class="breed-card"
        matRipple
        (click)="goToDetail(breed.id)"
      >
        <img
          *ngIf="breed.image"
          mat-card-image
          [src]="breed.image"
          [alt]="breed.name"
          loading="lazy"
        />
        <div *ngIf="!breed.image" class="card-icon-banner">
          <mat-icon>{{ breed.icon }}</mat-icon>
        </div>

        <mat-card-header>
          <mat-card-title>{{ breed.name }}</mat-card-title>
          <mat-card-subtitle>
            <mat-chip-set>
              <mat-chip color="primary" highlighted>
                <mat-icon matChipAvatar>place</mat-icon>
                {{ breed.origin }}
              </mat-chip>
              <mat-chip>
                <mat-icon matChipAvatar>schedule</mat-icon>
                {{ breed.lifespan }}
              </mat-chip>
            </mat-chip-set>
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p class="breed-temperament">
            <mat-icon>favorite</mat-icon>
            {{ breed.temperament }}
          </p>
          <p class="breed-summary">{{ breed.summary }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-button color="primary">
            <mat-icon>pets</mat-icon>
            Conhecer raça
          </button>
          <mat-icon class="card-arrow">arrow_forward</mat-icon>
        </mat-card-actions>

      </mat-card>
    </div>

  </div>
</section>
