<mat-toolbar class="navbar" [class.scrolled]="scrolled">

  <button mat-button class="nav-logo" (click)="goHome()">
    <mat-icon>pets</mat-icon>
    CatWorld
  </button>

  <span class="nav-spacer"></span>

  <nav class="nav-links">
    <button
      mat-button
      *ngFor="let link of links"
      (click)="navigateTo(link.id)"
      class="nav-link-btn"
    >
      <mat-icon>{{ link.icon }}</mat-icon>
      {{ link.label }}
    </button>
  </nav>

  <span class="nav-spacer"></span>

  <ng-container *ngIf="!authService.isLoggedIn()">
    <button
      *ngIf="!showGoogleBtn"
      mat-stroked-button
      color="primary"
      class="nav-btn-login"
      (click)="showLoginButton()"
    >
      <mat-icon>account_circle</mat-icon>
      Entrar com Google
    </button>

  
    <div
      *ngIf="showGoogleBtn"
      #googleBtn
      class="google-btn-wrapper"
    ></div>

    <span *ngIf="authService.loginError()" class="google-login-error">
      {{ authService.loginError() }}
    </span>
  </ng-container>


  <button
    *ngIf="authService.isLoggedIn()"
    mat-button
    [matMenuTriggerFor]="userMenu"
    class="nav-user-btn"
  >
    <img
      *ngIf="authService.user()?.photoUrl && !avatarError"
      [src]="authService.user()?.photoUrl"
      [alt]="authService.user()?.name"
      class="user-avatar"
      (error)="avatarError = true"
    />
    <mat-icon *ngIf="!authService.user()?.photoUrl || avatarError" class="user-avatar user-avatar-fallback">
      account_circle
    </mat-icon>
    <span class="user-name">{{ authService.user()?.name?.split(' ')?.[0] }}</span>
    <mat-icon iconPositionEnd class="nav-user-arrow">arrow_drop_down</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="user-menu-header">
      <img
        *ngIf="authService.user()?.photoUrl && !avatarError"
        [src]="authService.user()?.photoUrl"
        [alt]="authService.user()?.name"
        class="user-menu-avatar"
        (error)="avatarError = true"
      />
      <mat-icon *ngIf="!authService.user()?.photoUrl || avatarError" class="user-menu-avatar user-menu-avatar-fallback">
        account_circle
      </mat-icon>
      <div>
        <p class="user-menu-name">{{ authService.user()?.name }}</p>
        <p class="user-menu-email">{{ authService.user()?.email }}</p>
      </div>
    </div>
    <mat-divider />
    <button mat-menu-item (click)="goToProfile()">
      <mat-icon>account_circle</mat-icon>
      Meu perfil
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      Sair
    </button>
  </mat-menu>


  <button
    mat-icon-button
    class="nav-hamburger"
    (click)="toggleMenu()"
    aria-label="Abrir menu"
  >
    <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>

</mat-toolbar>


<div class="nav-mobile" [class.open]="menuOpen">
  <button
    mat-button
    *ngFor="let link of links"
    (click)="navigateTo(link.id)"
    class="nav-mobile-btn"
  >
    <mat-icon>{{ link.icon }}</mat-icon>
    {{ link.label }}
  </button>

  <button
    *ngIf="!authService.isLoggedIn()"
    mat-stroked-button
    color="primary"
    class="nav-mobile-login"
    (click)="showLoginButton()"
  >
    <mat-icon>account_circle</mat-icon>
    Entrar com Google
  </button>

  <div *ngIf="authService.isLoggedIn()" class="nav-mobile-user">
    <button class="nav-mobile-user-info" (click)="goToProfile()">
      <img
        *ngIf="authService.user()?.photoUrl && !avatarError"
        [src]="authService.user()?.photoUrl"
        [alt]="authService.user()?.name"
        class="user-avatar"
        (error)="avatarError = true"
      />
      <mat-icon *ngIf="!authService.user()?.photoUrl || avatarError" class="user-avatar user-avatar-fallback">
        account_circle
      </mat-icon>
      <span>{{ authService.user()?.name }}</span>
    </button>
    <button mat-icon-button (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</div>
