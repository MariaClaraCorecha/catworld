<mat-toolbar class="navbar" [class.scrolled]="scrolled">
  <div class="nav-inner">

    <span class="nav-logo" (click)="scrollTo('hero')">
      🐱 CatWorld
    </span>

    <span class="nav-spacer"></span>

    <!-- Links desktop -->
    <nav class="nav-links">
      <button
        mat-button
        *ngFor="let link of links"
        (click)="scrollTo(link.id)"
        class="nav-link-btn"
      >
        {{ link.label }}
      </button>
    </nav>

    <!-- Login -->
    <button mat-raised-button color="primary" class="nav-btn-login">
      <mat-icon>account_circle</mat-icon>
      Entrar com Google
    </button>

    <!-- Hamburguer mobile -->
    <button mat-icon-button class="nav-hamburger" (click)="toggleMenu()">
      <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>

  </div>

  <!-- Menu mobile -->
  <div class="nav-mobile" [class.open]="menuOpen">
    <button
      mat-button
      *ngFor="let link of links"
      (click)="scrollTo(link.id)"
    >
      {{ link.label }}
    </button>
  </div>
</mat-toolbar>
