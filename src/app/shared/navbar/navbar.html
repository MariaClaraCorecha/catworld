<mat-toolbar class="navbar" [class.scrolled]="scrolled">

  
  <button mat-button class="nav-logo" (click)="goHome()">
    <mat-icon>pets</mat-icon>
    CatWorld
  </button>

  <span class="nav-spacer"></span>

  
  <nav class="nav-links">
    <button
      mat-button
      *ngFor="let link of links"
      (click)="navigateTo(link.id)"
      class="nav-link-btn"
    >
      <mat-icon>{{ link.icon }}</mat-icon>
      {{ link.label }}
    </button>
  </nav>

  <span class="nav-spacer"></span>


  <button mat-stroked-button color="primary" class="nav-btn-login">
    <mat-icon>account_circle</mat-icon>
    Entrar com Google
  </button>

  <button
    mat-icon-button
    class="nav-hamburger"
    (click)="toggleMenu()"
    aria-label="Abrir menu"
  >
    <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>

</mat-toolbar>

<div class="nav-mobile" [class.open]="menuOpen">
  <button
    mat-button
    *ngFor="let link of links"
    (click)="navigateTo(link.id)"
    class="nav-mobile-btn"
  >
    <mat-icon>{{ link.icon }}</mat-icon>
    {{ link.label }}
  </button>

  <button mat-stroked-button color="primary" class="nav-mobile-login">
    <mat-icon>account_circle</mat-icon>
    Entrar com Google
  </button>
</div>
